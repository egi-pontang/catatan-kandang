<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F6B2E">
<title>Catatan Kandang Ayam Petelur</title>
<style>
:root{
  --bg:#F2F5F0; --surface:#FFFFFF; --ink:#18241B; --muted:#5B6B5F; --line:#D5DED3;
  --green:#1F6B2E; --leaf:#6DB33F; --brown:#5A2A17; --yellow:#F5B820; --soft:#E6F0E4;
  --warn:#FFF1CC; --warnink:#6B4600; --bad:#B3261E; --badsoft:#FBE4E1; --ok:#1E7A34;
  --shadow:0 1px 2px rgba(20,40,25,.08);
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme:dark; --bg:#0F1511; --surface:#18211B; --ink:#E8EFE6; --muted:#9BAA9E; --line:#2C3A2F;
    --green:#5DBB6E; --soft:#1F2D22; --warn:#3A2F10; --warnink:#F2D78A; --bad:#FF8A80; --badsoft:#3A1E1B; --ok:#7FD493; --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:var(--green);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
header img{width:38px;height:38px;border-radius:50%;background:#fff}
header .ttl{flex:1;min-width:0}
header .ttl b{display:block;font-size:16px;line-height:1.15}
header .ttl span{font-size:12px;opacity:.9}
#status{font-size:12px;background:rgba(255,255,255,.18);border-radius:999px;padding:4px 10px;white-space:nowrap}
#status.bad{background:var(--yellow);color:#3b2a00}
#banner{margin:10px 12px 0;padding:10px 12px;border-radius:10px;background:var(--warn);color:var(--warnink);font-size:14px;display:none}
main{padding:12px;max-width:760px;margin:0 auto}
h2{font-size:19px;margin:6px 0 10px}
h3{font-size:16px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin:0 -12px;padding-left:12px;padding-right:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 12px;text-align:left;font:inherit;min-width:112px}
.chip b{display:block;font-size:15px}
.chip small{color:var(--muted);font-size:12px}
.chip[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.chip[aria-pressed=true] small{color:#DCEFD9}
.datebar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.datebar input{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;font:inherit;min-height:44px}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:36px;padding:6px 10px;font-size:14px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:44px}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:3px solid var(--leaf);outline-offset:1px}
label.f{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;box-shadow:var(--shadow)}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px;font-weight:600}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:transparent;flex:0 0 auto}
details.sec>summary .tick.done{background:var(--ok);border-color:var(--ok);color:#fff}
details.sec>summary .sub{margin-left:auto;font-weight:400;font-size:13px;color:var(--muted);text-align:right}
details.sec .body{padding:0 12px 12px}
.target{background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.target .big{font-size:26px;font-weight:700;color:var(--green);line-height:1.1}
.mix{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.mix th,.mix td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right}
.mix th:first-child,.mix td:first-child{text-align:left}
.tog{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;min-height:46px;background:var(--surface)}
.tog input{width:24px;height:24px;min-height:0;flex:0 0 auto;accent-color:var(--green)}
.note{font-size:13px;color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;background:var(--soft);color:var(--green);font-weight:600}
.pill.bad{background:var(--badsoft);color:var(--bad)}
.pill.warn{background:var(--warn);color:var(--warnink)}
.list .row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list .row:last-child{border-bottom:0}
.list .row .grow{flex:1;min-width:0}
.list .row b{display:block}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:center}
table.t th{font-size:12px;color:var(--muted);font-weight:600}
table.t td:first-child,table.t th:first-child{text-align:left}
.scroll{overflow-x:auto;margin:0 -4px}
.empty{text-align:center;color:var(--muted);padding:18px 8px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:11px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px}
nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{color:var(--green);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#243A2A;color:#fff;border-radius:999px;padding:8px 16px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.warnbox{background:var(--warn);color:var(--warnink);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.okbox{background:var(--soft);color:var(--green);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}

a{color:var(--green)}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--bad);font-weight:700}
.grow{flex:1;min-width:0}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.ccard{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;color:var(--ink);box-shadow:var(--shadow)}
.ccard .cn{font-weight:700}.ccard .ch{font-size:22px;font-weight:700;color:var(--green);line-height:1.1}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--surface);border:1px solid var(--line);border-left-width:5px}
.alert[data-go]{cursor:pointer}
.alert.bad{border-left-color:var(--bad);background:var(--badsoft)}.alert.warn{border-left-color:var(--yellow)}.alert.info{border-left-color:var(--leaf)}.alert.good{border-left-color:var(--ok)}
.alert .aic{flex:0 0 22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--line)}
.alert b{display:block}
.subtabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.subtabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;min-height:40px}
.subtabs button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.pchips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;min-height:40px}
.pchip.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.vrow{padding:10px 0;border-bottom:1px solid var(--line)}.vrow:last-child{border-bottom:0}
.vrow .grow b{display:block}.vact{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.vd{width:auto;min-height:36px;padding:4px 6px;flex:1;min-width:130px}
.menuitem{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;font:inherit;color:var(--ink);box-shadow:var(--shadow)}
.menuitem b{display:block;font-size:16px}
.row.tk{cursor:pointer}.row.tk input{width:24px;height:24px;min-height:0;flex:0 0 auto;accent-color:var(--green)}
tr.sel td{background:var(--warn)}td.hot{background:var(--badsoft);color:var(--bad);font-weight:700}
ul.ul,ol.ol,ol.note{padding-left:20px;margin:6px 0}
.note.ul li,.ol li{margin-bottom:4px}
code,textarea.code{font-family:ui-monospace,monospace}
@media (max-width:360px){.cgrid{grid-template-columns:1fr}}

.feed th,.feed td{padding:8px 6px;font-size:13px}.feed td:first-child{text-align:left}
.gi{width:84px;min-height:42px;padding:6px;text-align:right;border:1px solid var(--line);background:var(--input);border-radius:8px}
.vid{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.vid.big{flex-direction:column;align-items:stretch}.vframe{width:100%;aspect-ratio:9/16;max-height:70vh;border:0;border-radius:12px;background:#000}
.vthumb{position:relative;flex:0 0 96px;height:128px;border:0;border-radius:10px;overflow:hidden;background:#14302b;padding:0;cursor:pointer}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vthumb .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center;font-size:16px}
.vt{display:flex;flex-direction:column;gap:4px}.vt a{font-weight:600}
.menurow{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);font:inherit;color:var(--ink);cursor:pointer}
.card.inner{background:var(--input);box-shadow:none;margin:10px 0}

a.btn{display:inline-block;text-decoration:none;color:inherit}a.btn.primary{color:#fff}
.foot{margin:18px 0 8px;padding:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute);text-align:center}.foot div{margin:3px 0}
.promo{border-left:5px solid var(--yellow)}
.vlinks{display:flex;flex-direction:column;gap:6px;margin-top:8px}.vlinks .btn{text-align:left}
.vthumb.fb{background:#1877F2;cursor:default;display:grid;place-items:center}.fbmark{font:700 46px Georgia,serif;color:#fff}
.vid.fbv .vt .btn{margin-top:4px}
</style>
</head>

<script type="text/plain" id="gsCode">/*
  Catatan Kandang Ayam Petelur - skrip penghubung Google Sheet dan Google Drive.
  Tempel di script.google.com lalu Deploy sebagai Aplikasi web.
  Otomatis membuat: Google Sheet, folder Drive (Data, Cadangan, Foto), dan tab Dashboard.
  Ubah HANYA dua baris di bawah ini: KUNCI dan (opsional) ID_SHEET.
*/
var KUNCI = 'GANTI-DENGAN-KODE-RAHASIA-ANDA'; // 1) kode rahasia pilihan Anda (huruf dan angka), samakan di aplikasi
var NAMA_FOLDER = 'Catatan Kandang Ayam';
var NAMA_SHEET = 'Catatan Kandang Ayam';
var ID_SHEET = ''; // 2) opsional: ID Google Sheet yang sudah ada. Kosongkan agar dibuat otomatis
var ZONA = 'Asia/Jakarta';
var SAJIKAN_APLIKASI = true; // true: hanya untuk deployment "Hanya saya" (aplikasi dibuka dari Drive). Pakai GitHub Pages dan deployment "Siapa saja": ubah ke false.
var NAMA_FILE_APP = ['Catatan_Kandang.html', 'Catatan_Kandang_Almahyra.html', 'Catatan_Kandang_Peternak.html']; // nama file aplikasi di Google Drive (mode aplikasi)

function out_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }
function cek_(k) { return String(k || '') === KUNCI; }
function sub_(parent, name) { var it = parent.getFoldersByName(name); return it.hasNext() ? it.next() : parent.createFolder(name); }
function root_() {
  var P = PropertiesService.getScriptProperties(), id = P.getProperty('ROOT'), f = null;
  if (id) { try { f = DriveApp.getFolderById(id); if (f.isTrashed()) f = null; } catch (e) { f = null; } }
  if (!f) { var it = DriveApp.getFoldersByName(NAMA_FOLDER); f = it.hasNext() ? it.next() : DriveApp.createFolder(NAMA_FOLDER); P.setProperty('ROOT', f.getId()); }
  return f;
}
function ss_() {
  var P = PropertiesService.getScriptProperties(), id = P.getProperty('SS'), s = null;
  if (ID_SHEET) { try { s = SpreadsheetApp.openById(ID_SHEET); } catch (e) { s = null; } }
  if (!s && id) { try { s = SpreadsheetApp.openById(id); } catch (e) { s = null; } }
  if (!s) {
    s = SpreadsheetApp.create(NAMA_SHEET);
    P.setProperty('SS', s.getId());
    try { DriveApp.getFileById(s.getId()).moveTo(root_()); } catch (e) {}
  }
  return s;
}
function simpan_(folder, name, text) {
  var it = folder.getFilesByName(name);
  if (it.hasNext()) { it.next().setContent(text); } else { folder.createFile(name, text, MimeType.PLAIN_TEXT); }
}
// Jalankan sekali dari editor (pilih fungsi setup lalu Run) bila ingin mengizinkan akses lebih dulu.
function setup() { Logger.log(ss_().getUrl()); Logger.log(root_().getUrl()); }

// Mode aplikasi: membuka URL /exec tanpa parameter menampilkan aplikasi dari file di Google Drive.
// Deploy dengan akses "Hanya saya" agar aplikasi dan kode rahasia tidak terbuka untuk umum.
function pagina_() {
  if (!SAJIKAN_APLIKASI) return ContentService.createTextOutput('Layanan Catatan Kandang aktif.');
  var f = null;
  for (var i = 0; i < NAMA_FILE_APP.length && !f; i++) {
    var it = DriveApp.getFilesByName(NAMA_FILE_APP[i]);
    while (it.hasNext()) { var g = it.next(); if (!f || g.getLastUpdated() > f.getLastUpdated()) f = g; }
  }
  if (!f) return HtmlService.createHtmlOutput('<p style="font-family:sans-serif;padding:16px">File <b>' + NAMA_FILE_APP[0] + '</b> belum ada di Google Drive Anda. Unggah file aplikasi ke Drive, lalu buka ulang halaman ini.</p>').setTitle('Catatan Kandang');
  var html = f.getBlob().getDataAsString('UTF-8');
  // Kode rahasia disisipkan otomatis. Karena itu deploy mode aplikasi WAJIB dengan akses "Hanya saya".
  html = html.replace('window.GS_CFG={"url":"","key":""};', 'window.GS_CFG={"url":"","key":' + JSON.stringify(KUNCI) + '};');
  return HtmlService.createHtmlOutput(html).setTitle('Catatan Kandang Ayam Petelur')
    .addMetaTag('viewport', 'width=device-width, initial-scale=1').setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);
}
function apiGet(req) { return doGet({ parameter: req }).getContent(); }
function apiPost(str) { return doPost({ postData: { contents: str } }).getContent(); }

function doGet(e) {
  var p = (e && e.parameter) || {};
  if (!p.action) return pagina_();
  if (!cek_(p.key)) return out_({ error: 'Kode rahasia salah' });
  var P = PropertiesService.getScriptProperties();
  if (p.action === 'ping') { var s = ss_(), r = root_(); try { if (!P.getProperty('MOVED')) { DriveApp.getFileById(s.getId()).moveTo(r); P.setProperty('MOVED', '1'); } } catch (e) {} sub_(r, 'Data'); sub_(r, 'Cadangan'); sub_(r, 'Foto'); return out_({ ok: true, ssUrl: s.getUrl(), folderUrl: r.getUrl(), rev: Number(P.getProperty('REV') || 0) }); }
  if (p.action === 'rev') return out_({ rev: Number(P.getProperty('REV') || 0) });
  if (p.action === 'load') {
    var it = sub_(root_(), 'Data').getFilesByName('data-terbaru.json');
    if (!it.hasNext()) return out_({ rev: 0, state: null });
    return out_({ rev: Number(P.getProperty('REV') || 0), state: JSON.parse(it.next().getBlob().getDataAsString()) });
  }
  return out_({ error: 'Aksi tidak dikenal' });
}
function doPost(e) {
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    var b = JSON.parse(e.postData.contents);
    if (!cek_(b.key)) return out_({ error: 'Kode rahasia salah' });
    if (b.action === 'sync') return sync_(b);
    if (b.action === 'photo') return foto_(b);
    return out_({ error: 'Aksi tidak dikenal' });
  } catch (err) { return out_({ error: String(err) }); }
  finally { lock.releaseLock(); }
}
function sync_(b) {
  var root = root_(), data = sub_(root, 'Data'), P = PropertiesService.getScriptProperties();
  var json = JSON.stringify(b.state);
  simpan_(data, 'data-terbaru.json', json);
  var hari = Utilities.formatDate(new Date(), ZONA, 'yyyy-MM-dd'), cad = sub_(root, 'Cadangan');
  simpan_(cad, 'cadangan-' + hari + '.json', json);
  var fs = [], it = cad.getFiles();
  while (it.hasNext()) fs.push(it.next());
  if (fs.length > 45) { fs.sort(function (a, c) { return a.getDateCreated() - c.getDateCreated(); }); for (var i = 0; i < fs.length - 45; i++) fs[i].setTrashed(true); }
  var ss = ss_(), T = b.tables || {};
  Object.keys(T).forEach(function (nama) { tulis_(ss, nama, T[nama]); });
  try { dashboard_(ss); } catch (e) {}
  var def = ss.getSheetByName('Sheet1');
  if (def && ss.getSheets().length > 1) ss.deleteSheet(def);
  P.setProperty('REV', String(b.rev || Date.now()));
  return out_({ ok: true, rev: Number(P.getProperty('REV')), ssUrl: ss.getUrl(), folderUrl: root.getUrl() });
}
function tanggal_(v) {
  if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) { var p = v.split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12, 0, 0); }
  return v;
}
function tulis_(ss, nama, t) {
  var h = t.h || [], r = t.r || [], cols = h.length;
  if (!cols) return;
  var sh = ss.getSheetByName(nama) || ss.insertSheet(nama);
  sh.clear();
  if (sh.getMaxColumns() < cols) sh.insertColumnsAfter(sh.getMaxColumns(), cols - sh.getMaxColumns());
  if (sh.getMaxRows() < r.length + 2) sh.insertRowsAfter(sh.getMaxRows(), r.length + 2 - sh.getMaxRows());
  sh.getRange(1, 1, 1, cols).setValues([h]).setFontWeight('bold').setBackground('#1F6B2E').setFontColor('#FFFFFF');
  if (r.length) sh.getRange(2, 1, r.length, cols).setValues(r.map(function (row) { return row.map(tanggal_); }));
  sh.setFrozenRows(1);
  for (var c = 1; c <= cols; c++) sh.autoResizeColumn(c);
}
function foto_(b) {
  var nm = String(b.kelompok || 'Umum').replace(/[\\\/:*?"<>|]/g, '-');
  var fo = sub_(sub_(root_(), 'Foto'), nm);
  var blob = Utilities.newBlob(Utilities.base64Decode(b.data), 'image/jpeg', (b.tanggal || '') + '_' + (b.nama || 'foto') + '.jpg');
  var f = fo.createFile(blob);
  return out_({ ok: true, id: f.getId(), url: f.getUrl() });
}

// Membuat tab Dashboard (rumus otomatis) bila belum ada. Aman dijalankan berulang.
function dashboard_(ss) {
  if (ss.getSheetByName('Dashboard')) return;
  var sh = ss.insertSheet('Dashboard', 0);
  sh.getRange('A1').setValue('Dashboard ' + NAMA_SHEET).setFontWeight('bold').setFontSize(16);
  sh.getRange('A2').setValue('Terisi otomatis dari tab data. Isi lewat aplikasi, jangan mengetik di tab data.');
  var head = ['Kelompok', 'Hidup', 'Umur (mgg)', 'Fase', 'Target pakan hari ini (g)', 'Pakan 7 hari (kg)', 'Mati 7 hari', 'Telur 7 hari', 'Hen-day 7 hari (%)', 'Bobot terakhir (g)', 'Tgl timbang'];
  sh.getRange(4, 1, 1, 11).setValues([head]).setFontWeight('bold').setBackground('#1F6B2E').setFontColor('#FFFFFF');
  var W = 'Harian!$B:$B,">="&(TODAY()-6)', f = [];
  for (var r = 5; r <= 12; r++) {
    var k = r - 3, A = '$A' + r;
    f.push([
      '=IF(Kelompok!B' + k + '="","",Kelompok!B' + k + ')',
      '=IF(' + A + '="","",Kelompok!D' + k + ')',
      '=IF(' + A + '="","",Kelompok!F' + k + ')',
      '=IF(' + A + '="","",Kelompok!G' + k + ')',
      '=IF(' + A + '="","",Kelompok!K' + k + ')',
      '=IF(' + A + '="","",SUMIFS(Harian!$K:$K,Harian!$A:$A,' + A + ',' + W + ')/1000)',
      '=IF(' + A + '="","",SUMIFS(Harian!$E:$E,Harian!$A:$A,' + A + ',' + W + '))',
      '=IF(' + A + '="","",SUMIFS(Harian!$U:$U,Harian!$A:$A,' + A + ',' + W + '))',
      '=IF(' + A + '="","",IFERROR(SUMIFS(Harian!$U:$U,Harian!$A:$A,' + A + ',' + W + ')/SUMIFS(Harian!$D:$D,Harian!$A:$A,' + A + ',' + W + ')*100,""))',
      '=IF(' + A + '="","",Kelompok!L' + k + ')',
      '=IF(' + A + '="","",Kelompok!M' + k + ')'
    ]);
  }
  sh.getRange(5, 1, 8, 11).setFormulas(f);
  sh.getRange(13, 1, 1, 8).setFormulas([['Total', '=SUM(B5:B12)', '', '', '=SUM(E5:E12)', '=SUM(F5:F12)', '=SUM(G5:G12)', '=SUM(H5:H12)']]).setFontWeight('bold');
  sh.setColumnWidth(1, 210);
}
</script>

<script>
"use strict";

/* ================= UTIL ================= */
function pad(n){return(n<10?"0":"")+n}
function isoOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseISO(s){var p=String(s).split("-");return new Date(+p[0],+p[1]-1,+p[2],12,0,0)}
function todayISO(){return isoOf(new Date())}
function addDays(s,n){var d=parseISO(s);d.setDate(d.getDate()+n);return isoOf(d)}
function diffDays(a,b){return Math.round((parseISO(a)-parseISO(b))/86400000)}
function weekStart(s){var d=parseISO(s);var wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return isoOf(d)}
function dmy(s){return s?String(s).split("-").reverse().join("/"):"-"}
function fmt(x,d){if(x===null||x===undefined||isNaN(x)||!isFinite(x))return"-";return Number(x).toFixed(d===undefined?0:d).replace(".",",")}
function rp(x){if(x===null||x===undefined||isNaN(x))return"-";var s=Math.round(Math.abs(x)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");return(x<0?"-":"")+"Rp "+s}
function num(v){var x=parseFloat(String(v).replace(",","."));return isNaN(x)?null:x}
function esc(s){return String(s===undefined||s===null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function hasValue(v){return v!==undefined&&v!==""&&v!==null}
function sum(a){return a.reduce(function(x,y){return x+y},0)}

/* ================= LOGIKA PAKAN, UMUR, FASE ================= */
function ageDays(c,date){return diffDays(date,c.birth)}
function ageW(c,date){return ageDays(c,date)/7}
function gIsa(a){var w=Math.floor(a);if(w<4)return 26;if(w>=23)return 115;return ISA_G[w]}
function phaseOf(a){if(a<6)return"Starter";if(a<11)return"Grower";if(a<17)return"Developer";if(a<19)return"Pre-layer";if(a<55)return"Layer 1";if(a<65)return"Layer 2";return"Layer 3"}
function dkey(c,d){return c+"|"+d}
function getRec(c,d){return state.daily[dkey(c,d)]||{}}
function setField(c,d,f,v){var k=dkey(c,d),r=state.daily[k]||(state.daily[k]={});r[f]=v;r._t=Date.now();queueSave()}
function lastHidup(c,date){var best=null,bd="";for(var k in state.daily){var p=k.split("|");if(p[0]!==c)continue;var r=state.daily[k];
  if(p[1]<date&&hasValue(r.hidup)&&p[1]>bd){bd=p[1];best=num(r.hidup)}}return best===null?cohortBy(c).n:best}
function effHidup(c,date){var r=getRec(c,date),h=num(r.hidup);if(h!==null)return h;var base=lastHidup(c,date),m=num(r.mati)||0;return Math.max(0,base-m)}
function targetG(c,date){return effHidup(c.key,date)*gPerBird(c,date)}
function consumed(r){var fp=feedParts(r);if(fp.has)return fp.pagi+fp.siang+fp.sore-(num(r.sisa)||0);var a=num(r.pagi),b=num(r.sore);if(a===null&&b===null)return null;return(a||0)+(b||0)-(num(r.sisa)||0)}
function mixAt(c,date){return MIX[phaseAt(c,date)]}
function lastRecDate(ck){var best="";for(var k in state.daily){var p=k.split("|");if(p[0]===ck&&p[1]>best)best=p[1]}return best}
function curHidup(c){var d=lastRecDate(c.key);return d?effHidup(c.key,d):c.n}
function mixStats(mix,ing){var pk=0,ca=0,me=0,h=0;for(var i=0;i<4;i++){var g=(ing||state.ing)[MIX_KEYS[i]];pk+=mix[i]*g.pk;ca+=mix[i]*g.ca;me+=mix[i]*g.me;h+=mix[i]*g.h}return{pk:pk,ca:ca,me:me,h:h}}

/* ================= REKAP, BOBOT, KESEHATAN ================= */
function weeklyRows(c){
  var map={};
  for(var k in state.daily){var p=k.split("|");if(p[0]!==c)continue;var r=state.daily[k];
    var ws=weekStart(p[1]);var w=map[ws]||(map[ws]={ws:ws,days:0,telur:0,hs:0,hn:0,pakan:0,retak:0,mati:0});
    w.days++;w.telur+=num(r.telur)||0;w.retak+=num(r.retak)||0;w.mati+=num(r.mati)||0;
    var cons=consumed(r);if(cons!==null)w.pakan+=cons;w.hs+=effHidup(c,p[1]);w.hn++}
  var out=[];for(var ws in map){var w=map[ws];w.avgH=w.hs/w.hn;w.henday=(w.avgH>0&&w.days>0)?w.telur/(w.avgH*w.days)*100:null;
    var ew=num((state.eggw[c+"|"+ws]||{}).g);w.eg=ew;w.fcr=(ew&&w.telur>0)?(w.pakan/1000)/(w.telur*ew/1000):null;out.push(w)}
  out.sort(function(a,b){return a.ws<b.ws?1:-1});return out;
}
function weighStats(vals,ref){
  var v=vals.map(num).filter(function(x){return x!==null&&x>0});if(!v.length)return null;
  var avg=sum(v)/v.length,inr=v.filter(function(x){return Math.abs(x-avg)<=avg*0.10}).length;
  var sd=Math.sqrt(sum(v.map(function(x){return(x-avg)*(x-avg)}))/v.length);
  return{n:v.length,avg:avg,uni:inr/v.length*100,cv:sd/avg*100,min:Math.min.apply(null,v),max:Math.max.apply(null,v),diff:ref?(avg-ref)/ref*100:null};
}
function lastWeigh(ck){var l=state.weigh.filter(function(x){return x.c===ck}).sort(function(a,b){return a.date<b.date?1:-1});return l[0]||null}
function lastGiven(ck,kind){
  var best="",names=BERI_JENIS[kind]||[];
  for(var k in state.daily){var p=k.split("|");if(p[0]!==ck)continue;var b=state.daily[k].beri||[];if(b.indexOf(kind)>=0&&p[1]>best)best=p[1]}
  state.health.forEach(function(h){if((h.c===ck||h.c==="ALL")&&names.indexOf(h.jenis)>=0&&h.date>best)best=h.date});
  return best||null;
}
function vaxState(c,it,date){
  var rec=state.vax[c.key+"|"+it.id],age=ageDays(c,date);
  if(rec&&rec.date)return{k:"done",date:rec.date};
  if(rec&&rec.skip)return{k:"skip"};
  if(age<it.a)return{k:"soon",days:it.a-age};
  if(age<=it.b)return{k:"due",days:it.b-age};
  return{k:"late",days:age-it.b};
}

/* ================= STOK, KEBUTUHAN, BIAYA ================= */
function dayUsage(date,today){
  var use=[0,0,0,0];
  activeCohorts().forEach(function(c){
    var r=getRec(c.key,date),fu=feedUse(c,date,r);
    if(fu===null){var g=date<today?targetG(c,date):0,mix=mixAt(c,date);for(var i=0;i<4;i++)use[i]+=g*mix[i]}
    else{for(var j=0;j<4;j++)use[j]+=fu[j]}
  });return use;
}
function stockNow(){
  var s=state.stock,t=todayISO(),cur={},keys=MIX_KEYS.slice(),used=[0,0,0,0];
  if(s.gf===null||s.gf===undefined||s.gf==="")return null;
  for(var d=addDays(s.date,1);d<=t;d=addDays(d,1)){var u=dayUsage(d,t);for(var i=0;i<4;i++)used[i]+=u[i]}
  for(var j=0;j<4;j++){var base=num(s[keys[j]]);cur[keys[j]]=base===null?0:base-used[j]/1000}
  return cur;
}
function projectNeeds(weeks){
  var t=todayISO(),rows=[],cum=[0,0,0,0];
  var hid={};activeCohorts().forEach(function(c){hid[c.key]=curHidup(c)});
  for(var w=0;w<weeks;w++){
    var ws=addDays(t,w*7),tot=[0,0,0,0],kg=0;
    for(var d=0;d<7;d++){var day=addDays(ws,d);
      activeCohorts().forEach(function(c){var g=hid[c.key]*gPerBird(c,day),mix=mixAt(c,day);kg+=g;for(var i=0;i<4;i++)tot[i]+=g*mix[i]})}
    for(var i=0;i<4;i++)cum[i]+=tot[i]/1000;
    rows.push({ws:ws,perDay:kg/7/1000,kg:tot.map(function(x){return x/1000}),cum:cum.slice()});
  }return rows;
}
function monthCost(ck,month){
  var out={pakan:0,biayaPakan:0,telur:0,retak:0,hari:0};
  for(var k in state.daily){var p=k.split("|");if(p[1].slice(0,7)!==month)continue;if(ck!=="ALL"&&p[0]!==ck)continue;
    var c=cohortBy(p[0]),r=state.daily[k],cons=consumed(r);out.hari++;out.telur+=num(r.telur)||0;out.retak+=num(r.retak)||0;
    if(cons!==null){out.pakan+=cons;var fu=feedUse(c,p[1],r);for(var i=0;i<4;i++)out.biayaPakan+=fu[i]/1000*state.ing[MIX_KEYS[i]].h}}
  return out;
}
function rearingCost(c){
  var feed=0,days=0;
  for(var k in state.daily){var p=k.split("|");if(p[0]!==c.key)continue;var r=state.daily[k],cons=consumed(r);if(cons===null)continue;days++;
    var fu=feedUse(c,p[1],r);for(var i=0;i<4;i++)feed+=fu[i]/1000*state.ing[MIX_KEYS[i]].h}
  var n=Math.max(1,c.n);return{feed:feed,days:days,perEkor:feed/n+(num(c.hargaDoc)||0)};
}
function projIsa(p){
  var n=cohortBy("ISA").n,hid=n*(1-p.mort/200),telur=hid*p.hdp/100*30,jual=telur*(1-p.retak/100),pend=jual*p.harga;
  var mixP=mixStats(MIX["Layer 1"]),bp=n*p.gPakan/1000*30*(1-p.mort/200)*mixP.h,lain=n*p.lain,peny=n*(p.hargaAyam-p.nilaiAfkir)/14;
  var biaya=bp+lain+peny,laba=pend-biaya,perEkorHari=(p.gPakan/1000*mixP.h+(p.lain+(p.hargaAyam-p.nilaiAfkir)/14)/30);
  var bep=perEkorHari/(p.harga*(1-p.retak/100))*100;
  return{n:n,telur:telur,pend:pend,bp:bp,lain:lain,peny:peny,biaya:biaya,laba:laba,margin:pend>0?laba/pend*100:null,biayaButir:jual>0?biaya/jual:null,bep:bep,hargaPakan:mixP.h,pakanButir:p.gPakan*mixP.h/1000/(p.hdp/100)};
}

function hasKV(){return typeof window!=="undefined"&&window.storage&&typeof window.storage.set==="function"}
function setStatus(){
  var el=typeof document!=="undefined"&&document.getElementById("status");if(!el)return;
  var t="",bad=false;
  if(!cfg.url){t="Belum tersambung Google";bad=true}
  else if(!cfg.key){t="Isi kode rahasia";bad=true}

}
function queueSave(){
  sync.dirty=true;setStatus();
  if(hasKV()){try{window.storage.set("almahyra-state",JSON.stringify(state))}catch(e){}}
  if(!cfg.url||!sync.loaded)return;
  clearTimeout(sync.timer);sync.timer=setTimeout(syncNow,2500);

function mergeMap(a,b){a=a||{};for(var k in(b||{})){if(!a[k]||((b[k]._t||0)>(a[k]._t||0)))a[k]=b[k]}return a}
function mergeArr(a,b,tomb){var m={};(a||[]).forEach(function(x){if(x&&x.id)m[x.id]=x});(b||[]).forEach(function(x){if(x&&x.id&&(!m[x.id]||(x._t||0)>(m[x.id]._t||0)))m[x.id]=x});
  var out=[];for(var id in m){var t=tomb[id];if(t&&t>=(m[id]._t||0))continue;out.push(m[id])}
  out.sort(function(x,y){return(x._t||0)-(y._t||0)});return out}
function mergeState(o){
  if(!o)return;var a=state;a.tomb=a.tomb||{};
  for(var id in(o.tomb||{}))a.tomb[id]=Math.max(a.tomb[id]||0,o.tomb[id]);
  ["daily","eggw","vax","tasks","cost","ing"].forEach(function(k){a[k]=mergeMap(a[k],o[k])});
  ["weigh","health","birds","hatch"].forEach(function(k){a[k]=mergeArr(a[k],o[k],a.tomb)});
  var m={},order=a.cohorts.map(function(c){m[c.key]=c;return c.key});
  (o.cohorts||[]).forEach(function(c){if(!m[c.key]){m[c.key]=c;order.push(c.key)}else if((c._t||0)>(m[c.key]._t||0))m[c.key]=c});
  a.cohorts=order.map(function(k){return m[k]}).filter(function(c){return!(a.tomb[c.key]&&a.tomb[c.key]>=(c._t||0))});
  var live={};a.cohorts.forEach(function(c){live[c.key]=1});
  var dead=function(k){return a.tomb[k]&&!live[k]};
  ["daily","eggw","vax"].forEach(function(mp){Object.keys(a[mp]).forEach(function(key){if(dead(key.split("|")[0]))delete a[mp][key]})});
  ["weigh","health","birds","hatch"].forEach(function(n){a[n]=a[n].filter(function(x){return!dead(x.c)})});
  ["stock","proj","farm","setup"].forEach(function(k){if(o[k]&&(o[k]._t||0)>((a[k]||{})._t||0))a[k]=o[k]});
  ["ing"].forEach(function(k){for(var x in ING0)if(!a[k][x])a[k][x]=clone(ING0[x])});
}
function cohortDeleteCheck(i){
  var c=state.cohorts[i];if(!c)return"Kelompok tidak ditemukan.";
  var rest=state.cohorts.filter(function(x){return x!==c});
  if(rest.length<1)return"Sisakan minimal satu kelompok.";
  if(!rest.some(function(x){return x.aktif!==false}))return"Sisakan minimal satu kelompok yang aktif.";
  return"";
}
function deleteCohort(i){
  if(cohortDeleteCheck(i))return false;
  var c=state.cohorts[i],k=c.key,now=Date.now();
  state.tomb[k]=now;state.cohorts.splice(i,1);
  ["daily","eggw","vax"].forEach(function(mp){Object.keys(state[mp]).forEach(function(key){if(key.split("|")[0]===k)delete state[mp][key]})});
  ["weigh","health","birds","hatch"].forEach(function(n){state[n]=state[n].filter(function(x){if(x.c===k){state.tomb[x.id]=now;return false}return true})});
  if(typeof draft!=="undefined"&&draft.w)delete draft.w[k];
  var first=state.cohorts.filter(function(x){return x.aktif!==false})[0]||state.cohorts[0];
  if(ui.cohort===k||ui.vcohort===k)ui.cohort=first.key;
  queueSave();return true;
}

function syncNow(){
  if(!cfg.url||sync.busy||!sync.loaded)return Promise.resolve();
  sync.busy=true;sync.err="";setStatus();
  return gGet("rev").then(function(r){
    if(r.rev&&r.rev!==sync.rev){return gGet("load").then(function(ld){if(ld.state){mergeState(ld.state);if(typeof render==="function")render(true)}})}
  }).then(function(){
    var rev=Date.now();state.rev=rev;
    return gPost({action:"sync",state:state,tables:buildTables(),rev:rev}).then(function(res){
      sync.rev=res.rev||rev;sync.last=new Date();sync.dirty=false;if(res.ssUrl)sync.ssUrl=res.ssUrl;if(res.folderUrl)sync.folderUrl=res.folderUrl;
    });
  }).catch(function(e){sync.err=e.message||String(e);clearTimeout(sync.retry);sync.retry=setTimeout(syncNow,30000)})
  .then(function(){sync.busy=false;setStatus();if(typeof ui!=="undefined"&&ui.tab==="more"&&ui.moreSub==="data"&&typeof render==="function")render(true)});
}
function loadFromCloud(){
  if(!cfg.url)return Promise.resolve();
  sync.busy=true;setStatus();
  return gGet("load").then(function(ld){
    sync.rev=ld.rev||0;
    if(ld.state)mergeState(ld.state);
    sync.loaded=true;sync.err="";sync.last=ld.state?new Date():null;
  }).catch(function(e){sync.err=e.message||String(e);sync.loaded=true})
  .then(function(){sync.busy=false;setStatus();if(typeof render==="function")render(true);if(!sync.err&&sync.rev===0){sync.dirty=true;queueSave()}});
}

function consRatio(c,n){
  var ds=[];for(var k in state.daily){var p=k.split("|");if(p[0]===c.key&&consumed(state.daily[k])!==null)ds.push(p[1])}
  ds.sort().reverse();ds=ds.slice(0,n||3);if(!ds.length)return null;
  var a=0,b=0;ds.forEach(function(d){a+=consumed(getRec(c.key,d));b+=targetG(c,d)});return b>0?a/b:null;
}
function routineDue(c,t){
  var age=ageDays(c,t),ph=phaseAt(c,t),layer=ph.indexOf("Layer")===0,out=[];
  if(age<14)return out;
  var R=[["vit","Vitamin / elektrolit",layer?30:14],["prob","Probiotik",14],["jamu","Jamu",4]];
  R.forEach(function(x){var lg=lastGiven(c.key,x[0]);if(x[0]==="vit"&&!lg)lg=lastGiven(c.key,"elek");
    var since=lg?diffDays(t,lg):null;if(since===null||since>=x[2])out.push(x[1]+(since===null?" (belum ada catatan)":" ("+since+" hari lalu)"))});
  return out;
}
function diagBobot(c){
  var out=[],lw=lastWeigh(c.key),t=todayISO(),cr=consRatio(c,3),ph=phaseAt(c,t),ns=NUTR[ph],ms=mixStats(MIX[ph]);
  if(!lw){out.push({lv:"info",t:"Belum ada data timbang",d:"Timbang sampel tiap 2 minggu agar pertumbuhan bisa dinilai."});return out}
  var diff=lw.diff;
  if(diff!==null&&diff!==undefined){
    if(diff<-10)out.push({lv:"bad",t:"Bobot "+fmt(-diff,0)+"% di bawah acuan",d:"Masalah serius menurut panduan. Periksa kesehatan bersama dokter hewan dan cek protein pakan.",a:"Cek urutan: (1) PK dan EM pakan sesuai fase, (2) cacing, (3) air dan suhu, (4) penyakit."});
    else if(diff<-5)out.push({lv:"warn",t:"Bobot "+fmt(-diff,0)+"% di bawah acuan",d:"Kurang tumbuh: naikkan pakan 5%, cek kualitas pakan, cacing, kepadatan, dan tempat pakan."});
    else if(diff>5)out.push({lv:"warn",t:"Bobot "+fmt(diff,0)+"% di atas acuan",d:"Terlalu gemuk berisiko produksi turun dan telur terlambat. Kurangi jagung/nasi, pangkas pakan 5%, perbanyak hijauan."});
    else out.push({lv:"good",t:"Bobot sesuai acuan ("+fmt(diff,0)+"%)",d:"Pertahankan jadwal pakan."});
  }
  if(lw.uni<80)out.push({lv:"warn",t:"Uniformity "+fmt(lw.uni,0)+"% (target di atas 80%)",d:"Pisahkan ayam kecil dan beri pakan tambahan, kurangi pakan ayam besar. Pastikan tempat pakan cukup agar tidak berebut."});
  if(cr!==null&&diff!==null&&diff<-5&&cr>=0.98)out.push({lv:"bad",t:"Makan sesuai target tetapi bobot kurang",d:"Konsumsi "+fmt(cr*100,0)+"% dari target namun bobot tertinggal. Pola ini khas energi (EM) pakan rendah atau cacingan.",a:"Cek racikan di menu Cek racikan, dan tanyakan jadwal obat cacing ke dokter hewan."});
  else if(cr!==null&&cr<0.9)out.push({lv:"warn",t:"Konsumsi hanya "+fmt(cr*100,0)+"% dari target",d:"Cek panas, air minum, bau atau jamur pada pakan, dan tanda sakit."});
  if(ms.me<ns.me[0]-25)out.push({lv:"warn",t:"EM racikan fase "+ph+" sekitar "+fmt(ms.me,0)+" (acuan "+ns.me[0]+"-"+ns.me[1]+")",d:"EM yang kurang membuat ayam makan terus tetapi bobot buruk, dan di fase layer bisa membuat telur macet.",a:"Naikkan porsi jagung, atau uji substitusi bertahap 10% di menu Cek racikan."});
  var cac=lastGiven(c.key,"cac"),v2=state.vax[c.key+"|cac1"];
  if(ageDays(c,t)>=56&&!cac&&!(v2&&v2.date))out.push({lv:"info",t:"Belum ada catatan obat cacing",d:"Panduan menyebut obat cacing pertama sekitar 8-10 minggu bila ada indikasi. Konfirmasi ke dokter hewan lalu catat di menu Sehat."});
  return out;
}

  var h='<div class="card"><h3>Tautan pribadi untuk layar utama</h3><p class="note" style="margin-top:0">Bila aplikasi dibuka dari alamat web (misalnya GitHub Pages), tautan pribadi menyimpan alamat skrip dan kode rahasia di dalam tautan itu, jadi tidak perlu diisi setiap kali dibuka. Jangan bagikan tautan ini.</p>';
  if(!web)return h+'<div class="warnbox">Buka aplikasi dari alamat web (https://...) dulu, lalu buat tautan di sini.</div></div>';
  if(!cfg.url||!cfg.key)return h+'<p class="note" style="margin-bottom:0">Hubungkan Google dulu: isi URL dan kode rahasia, lalu ketuk Hubungkan dan tes.</p></div>';
  return h+'<div class="f"><div class="in"><textarea id="pLink" readonly>'+esc(personalLink(location.origin+location.pathname))+'</textarea></div></div><div class="btnrow"><button class="btn primary" data-act="copyLink">Salin tautan</button></div><p class="note" style="margin-bottom:0">Buka tautan ini di Chrome, lalu menu titik tiga > Tambahkan ke layar utama.</p></div>';
}
function init(){
  var hc=parseHash(typeof location!=="undefined"?location.hash:"");if(hc){cfg.url=hc.url;if(hc.key)cfg.key=hc.key}
  if(useGAS()&&!cfg.url)cfg.url="apps-script";
  var go2=function(){initEvents();render();setStatus();if(cfg.url&&cfg.key){sync.loaded=false;loadFromCloud()}};
  if(hasKV()){window.storage.get("almahyra-state").then(function(r){if(r&&r.value){try{mergeState(JSON.parse(r.value))}catch(e){}}go2()},go2)}else go2();
}
if(typeof document!=="undefined"&&document.addEventListener&&typeof window!=="undefined"&&!window.__TEST__){document.addEventListener("DOMContentLoaded",init)}
